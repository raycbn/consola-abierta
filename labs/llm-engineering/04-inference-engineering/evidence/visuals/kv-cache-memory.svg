<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">KV cache memory grows with sequence length</title><desc id="d">FP16 or BF16 illustrative cache size for 32 layers, eight KV heads and head dimension 128.</desc><rect width="1000" height="500" fill="#fbfaf7"/><text x="48" y="52" font-family="Arial" font-size="23" font-weight="700" fill="#192630">KV state grows linearly with cached tokens</text><text x="48" y="82" font-family="Arial" font-size="14" fill="#647078">32 layers · batch 1 · 8 KV heads · head_dim 128 · 2 bytes/value</text><text x="48" y="142" font-family="Arial" font-size="14" fill="#34444d">1,024 tokens</text><rect x="190" y="122" width="18.8" height="28" rx="3" fill="#28566b"/><text x="220.8" y="141" font-family="Arial" font-size="14" fill="#192630">128 MiB</text><text x="48" y="195" font-family="Arial" font-size="14" fill="#34444d">2,048 tokens</text><rect x="190" y="175" width="37.5" height="28" rx="3" fill="#28566b"/><text x="239.5" y="194" font-family="Arial" font-size="14" fill="#192630">256 MiB</text><text x="48" y="248" font-family="Arial" font-size="14" fill="#34444d">4,096 tokens</text><rect x="190" y="228" width="75.0" height="28" rx="3" fill="#28566b"/><text x="277.0" y="247" font-family="Arial" font-size="14" fill="#192630">512 MiB</text><text x="48" y="301" font-family="Arial" font-size="14" fill="#34444d">8,192 tokens</text><rect x="190" y="281" width="150.0" height="28" rx="3" fill="#28566b"/><text x="352.0" y="300" font-family="Arial" font-size="14" fill="#192630">1.0 GiB</text><text x="48" y="354" font-family="Arial" font-size="14" fill="#34444d">16,384 tokens</text><rect x="190" y="334" width="300.0" height="28" rx="3" fill="#28566b"/><text x="502.0" y="353" font-family="Arial" font-size="14" fill="#192630">2.0 GiB</text><text x="48" y="407" font-family="Arial" font-size="14" fill="#34444d">32,768 tokens</text><rect x="190" y="387" width="600.0" height="28" rx="3" fill="#28566b"/><text x="802.0" y="406" font-family="Arial" font-size="14" fill="#192630">4.0 GiB</text><text x="48" y="465" font-family="Arial" font-size="13" fill="#647078">Excludes allocator metadata, fragmentation, workspaces, weights and activations.</text></svg>