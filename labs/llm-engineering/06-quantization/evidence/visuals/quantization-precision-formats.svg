<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Floating-point and integer precision formats</title><desc id="desc">Comparison of FP16, BF16, FP8 E4M3 and E5M2, INT8 and INT4 by bit count and design intent.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient></defs><rect width="1200" height="470" rx="24" fill="url(#bg)"/><text x="55" y="58" fill="#e2e8f0" font-size="28" font-weight="700" font-family="Arial,sans-serif">PRECISION IS NOT JUST BIT COUNT</text><text x="55" y="88" fill="#94a3b8" font-size="16" font-family="Arial,sans-serif">Floating-point formats allocate bits to exponent and significand; integers depend on scale and zero-point.</text>
<g font-family="Arial,sans-serif">
<g transform="translate(60 130)"><text x="0" y="0" fill="#67e8f9" font-size="20" font-weight="700">FP16</text><text x="0" y="25" fill="#cbd5e1" font-size="14">16 bits · IEEE binary16</text><rect x="0" y="47" width="58" height="46" rx="5" fill="#fb923c"/><rect x="62" y="47" width="116" height="46" rx="5" fill="#0e7490"/><rect x="182" y="47" width="90" height="46" rx="5" fill="#155e75"/><text x="29" y="76" fill="#071426" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="120" y="76" fill="#ecfeff" font-size="15" font-weight="700" text-anchor="middle">5 exp</text><text x="227" y="76" fill="#ecfeff" font-size="15" font-weight="700" text-anchor="middle">10 frac</text><text x="0" y="122" fill="#94a3b8" font-size="14">More significand precision</text><text x="0" y="143" fill="#94a3b8" font-size="14">than BF16; narrower range.</text></g>
<g transform="translate(360 130)"><text x="0" y="0" fill="#67e8f9" font-size="20" font-weight="700">BF16</text><text x="0" y="25" fill="#cbd5e1" font-size="14">16 bits · bfloat16</text><rect x="0" y="47" width="58" height="46" rx="5" fill="#fb923c"/><rect x="62" y="47" width="156" height="46" rx="5" fill="#0e7490"/><rect x="222" y="47" width="50" height="46" rx="5" fill="#155e75"/><text x="29" y="76" fill="#071426" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="140" y="76" fill="#ecfeff" font-size="15" font-weight="700" text-anchor="middle">8 exp</text><text x="247" y="76" fill="#ecfeff" font-size="13" font-weight="700" text-anchor="middle">7</text><text x="0" y="122" fill="#94a3b8" font-size="14">FP32-like exponent range</text><text x="0" y="143" fill="#94a3b8" font-size="14">with fewer significand bits.</text></g>
<g transform="translate(660 130)"><text x="0" y="0" fill="#67e8f9" font-size="20" font-weight="700">FP8</text><text x="0" y="25" fill="#cbd5e1" font-size="14">8 bits · E4M3 / E5M2</text><rect x="0" y="47" width="42" height="46" rx="5" fill="#fb923c"/><rect x="46" y="47" width="104" height="46" rx="5" fill="#0e7490"/><rect x="154" y="47" width="118" height="46" rx="5" fill="#155e75"/><text x="21" y="76" fill="#071426" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="98" y="76" fill="#ecfeff" font-size="14" font-weight="700" text-anchor="middle">4 / 5 exp</text><text x="213" y="76" fill="#ecfeff" font-size="14" font-weight="700" text-anchor="middle">3 / 2 frac</text><text x="0" y="122" fill="#94a3b8" font-size="14">E4M3 favours precision;</text><text x="0" y="143" fill="#94a3b8" font-size="14">E5M2 favours exponent range.</text></g>
<g transform="translate(960 130)"><text x="0" y="0" fill="#67e8f9" font-size="20" font-weight="700">INT8 / INT4</text><text x="0" y="25" fill="#cbd5e1" font-size="14">8 / 4 bits · integer codes</text><rect x="0" y="47" width="132" height="46" rx="5" fill="#0e7490"/><rect x="140" y="47" width="132" height="46" rx="5" fill="#155e75"/><text x="66" y="76" fill="#ecfeff" font-size="17" font-weight="700" text-anchor="middle">INT8</text><text x="206" y="76" fill="#ecfeff" font-size="17" font-weight="700" text-anchor="middle">INT4</text><text x="0" y="122" fill="#94a3b8" font-size="14">Needs scale and often</text><text x="0" y="143" fill="#94a3b8" font-size="14">zero-point / grouping metadata.</text></g>
</g>
<rect x="60" y="355" width="1080" height="70" rx="12" fill="#0b3545" stroke="#155e75"/><text x="85" y="385" fill="#bae6fd" font-size="16" font-family="Arial,sans-serif" font-weight="700">Do not compare FP8, INT8, NF4 and INT4 as if they were interchangeable file labels.</text><text x="85" y="408" fill="#cbd5e1" font-size="14" font-family="Arial,sans-serif">Actual range, precision, scaling granularity, packing, accumulation dtype and kernel support determine behaviour.</text></svg>