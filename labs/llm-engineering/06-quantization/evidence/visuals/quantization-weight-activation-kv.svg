<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Weights, activations and KV cache quantization</title><desc id="desc">The three independent targets of quantization: model weights, activations during matrix operations, and key-value cache state.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient></defs><rect width="1200" height="440" rx="24" fill="url(#bg)"/><text x="55" y="58" fill="#e2e8f0" font-size="28" font-weight="700" font-family="Arial,sans-serif">THREE DIFFERENT QUANTIZATION TARGETS</text><text x="55" y="88" fill="#94a3b8" font-size="16" font-family="Arial,sans-serif">A checkpoint's weight format does not tell you the precision of activations or KV state.</text>
<g font-family="Arial,sans-serif">
<rect x="55" y="130" width="330" height="230" rx="18" fill="#142943" stroke="#0e7490"/><text x="82" y="170" fill="#67e8f9" font-size="17" font-weight="700">01 · WEIGHTS (W)</text><text x="82" y="208" fill="#f8fafc" font-size="27" font-weight="700">W4 / W8 / FP8</text><text x="82" y="242" fill="#cbd5e1" font-size="16">Persistent model parameters</text><text x="82" y="278" fill="#94a3b8" font-size="14">Primary goal: reduce weight footprint</text><text x="82" y="302" fill="#94a3b8" font-size="14">and potentially memory bandwidth.</text><rect x="82" y="322" width="112" height="22" rx="5" fill="#155e75"/><text x="138" y="338" fill="#ecfeff" font-size="12" text-anchor="middle">CHECKPOINT</text>
<rect x="435" y="130" width="330" height="230" rx="18" fill="#142943" stroke="#0e7490"/><text x="462" y="170" fill="#67e8f9" font-size="17" font-weight="700">02 · ACTIVATIONS (A)</text><text x="462" y="208" fill="#f8fafc" font-size="27" font-weight="700">A16 / A8 / FP8</text><text x="462" y="242" fill="#cbd5e1" font-size="16">Intermediate tensors in layers</text><text x="462" y="278" fill="#94a3b8" font-size="14">Primary goal: efficient matrix math</text><text x="462" y="302" fill="#94a3b8" font-size="14">with suitable calibration / scaling.</text><rect x="462" y="322" width="112" height="22" rx="5" fill="#155e75"/><text x="518" y="338" fill="#ecfeff" font-size="12" text-anchor="middle">GEMM PATH</text>
<rect x="815" y="130" width="330" height="230" rx="18" fill="#142943" stroke="#0e7490"/><text x="842" y="170" fill="#67e8f9" font-size="17" font-weight="700">03 · KV CACHE</text><text x="842" y="208" fill="#f8fafc" font-size="27" font-weight="700">FP16 / FP8</text><text x="842" y="242" fill="#cbd5e1" font-size="16">Keys and Values across tokens</text><text x="842" y="278" fill="#94a3b8" font-size="14">Primary goal: more context / active</text><text x="842" y="302" fill="#94a3b8" font-size="14">sequences within memory limits.</text><rect x="842" y="322" width="112" height="22" rx="5" fill="#155e75"/><text x="898" y="338" fill="#ecfeff" font-size="12" text-anchor="middle">SERVING STATE</text>
</g></svg>