<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">NCCL collective communication and ring AllReduce</title><desc id="d">Four ranks form a ring for reduce-scatter and all-gather phases. Collective results are replicated at all ranks.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9" stroke-width="1.7"/></marker></defs><rect width="1200" height="500" rx="24" fill="url(#bg)"/><text x="52" y="58" fill="#e2e8f0" font-family="Arial" font-size="28" font-weight="700">NCCL COLLECTIVES · DATA MOVES BETWEEN RANKS</text>
<g font-family="Arial">
<text x="65" y="110" fill="#67e8f9" font-size="18" font-weight="700">RING ALL-REDUCE · 4 RANKS · CONCEPTUAL</text>
<path d="M285 170L600 135L900 270L600 402L285 170" fill="none" stroke="#155e75" stroke-width="4" stroke-dasharray="9 6"/>
<path d="M285 170L570 138M620 144L880 260M884 286L625 394M575 389L300 184" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#ar)"/>
<g><rect x="220" y="135" width="130" height="68" rx="12" fill="#0b3545" stroke="#22d3ee"/><text x="285" y="162" text-anchor="middle" fill="#f8fafc" font-size="20">rank 0</text><text x="285" y="185" text-anchor="middle" fill="#bae6fd" font-size="13">GPU 0</text>
<rect x="535" y="100" width="130" height="68" rx="12" fill="#0b3545" stroke="#22d3ee"/><text x="600" y="127" text-anchor="middle" fill="#f8fafc" font-size="20">rank 1</text><text x="600" y="150" text-anchor="middle" fill="#bae6fd" font-size="13">GPU 1</text>
<rect x="835" y="235" width="130" height="68" rx="12" fill="#0b3545" stroke="#22d3ee"/><text x="900" y="262" text-anchor="middle" fill="#f8fafc" font-size="20">rank 2</text><text x="900" y="285" text-anchor="middle" fill="#bae6fd" font-size="13">GPU 2</text>
<rect x="535" y="370" width="130" height="68" rx="12" fill="#0b3545" stroke="#22d3ee"/><text x="600" y="397" text-anchor="middle" fill="#f8fafc" font-size="20">rank 3</text><text x="600" y="420" text-anchor="middle" fill="#bae6fd" font-size="13">GPU 3</text></g>
<rect x="75" y="250" width="300" height="112" rx="12" fill="#142943" stroke="#334e68"/><text x="98" y="281" fill="#67e8f9" font-size="17" font-weight="700">PHASE 1 · REDUCE-SCATTER</text><text x="98" y="310" fill="#cbd5e1" font-size="14">Chunks are reduced as they move.</text><text x="98" y="334" fill="#cbd5e1" font-size="14">Each rank retains one reduced chunk.</text>
<rect x="825" y="350" width="300" height="112" rx="12" fill="#142943" stroke="#334e68"/><text x="848" y="381" fill="#67e8f9" font-size="17" font-weight="700">PHASE 2 · ALL-GATHER</text><text x="848" y="410" fill="#cbd5e1" font-size="14">Reduced chunks circulate again.</text><text x="848" y="434" fill="#cbd5e1" font-size="14">Every rank reconstructs the result.</text>
<text x="60" y="473" fill="#94a3b8" font-size="13">NCCL may choose Ring, Tree or other algorithms/protocols according to function, message size, topology and version.</text>
</g></svg>