<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Parallelism strategy map for distributed LLM systems</title><desc id="d">A four-axis conceptual comparison: tensor parallelism splits layer matrices, pipeline parallelism splits depth, data parallelism replicates models across requests, and context parallelism splits sequence context.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient></defs><rect width="1200" height="500" rx="24" fill="url(#bg)"/><text x="52" y="58" fill="#e2e8f0" font-family="Arial" font-size="28" font-weight="700">FOUR AXES · FOUR DIFFERENT BOTTLENECKS</text>
<g font-family="Arial">
<rect x="55" y="112" width="520" height="145" rx="16" fill="#142943" stroke="#0e7490"/><text x="82" y="148" fill="#67e8f9" font-size="19" font-weight="700">TENSOR PARALLELISM (TP)</text><text x="82" y="184" fill="#f8fafc" font-size="21">Split matrices inside each layer</text><g fill="#0891b2"><rect x="84" y="204" width="90" height="30"/><rect x="178" y="204" width="90" height="30"/><rect x="272" y="204" width="90" height="30"/><rect x="366" y="204" width="90" height="30"/></g><text x="475" y="225" fill="#94a3b8" font-size="13">collectives</text>
<rect x="625" y="112" width="520" height="145" rx="16" fill="#142943" stroke="#0e7490"/><text x="652" y="148" fill="#67e8f9" font-size="19" font-weight="700">PIPELINE PARALLELISM (PP)</text><text x="652" y="184" fill="#f8fafc" font-size="21">Split model depth into stages</text><g fill="#155e75"><rect x="654" y="204" width="105" height="30"/><rect x="764" y="204" width="105" height="30"/><rect x="874" y="204" width="105" height="30"/><rect x="984" y="204" width="135" height="30"/></g><text x="1030" y="225" fill="#ecfeff" font-size="13" text-anchor="middle">activation handoffs</text>
<rect x="55" y="290" width="520" height="145" rx="16" fill="#142943" stroke="#0e7490"/><text x="82" y="326" fill="#67e8f9" font-size="19" font-weight="700">DATA PARALLELISM (DP)</text><text x="82" y="362" fill="#f8fafc" font-size="21">Replicate model, split requests</text><g><rect x="84" y="382" width="100" height="31" rx="5" fill="#0e7490"/><rect x="205" y="382" width="100" height="31" rx="5" fill="#0e7490"/><rect x="326" y="382" width="100" height="31" rx="5" fill="#0e7490"/><rect x="447" y="382" width="100" height="31" rx="5" fill="#0e7490"/></g><text x="134" y="403" fill="#ecfeff" font-size="12" text-anchor="middle">replica 0</text><text x="255" y="403" fill="#ecfeff" font-size="12" text-anchor="middle">replica 1</text><text x="376" y="403" fill="#ecfeff" font-size="12" text-anchor="middle">replica 2</text><text x="497" y="403" fill="#ecfeff" font-size="12" text-anchor="middle">replica 3</text>
<rect x="625" y="290" width="520" height="145" rx="16" fill="#142943" stroke="#0e7490"/><text x="652" y="326" fill="#67e8f9" font-size="19" font-weight="700">CONTEXT PARALLELISM (CP)</text><text x="652" y="362" fill="#f8fafc" font-size="21">Split sequence/context dimension</text><g fill="#155e75"><rect x="654" y="382" width="108" height="31"/><rect x="768" y="382" width="108" height="31"/><rect x="882" y="382" width="108" height="31"/><rect x="996" y="382" width="123" height="31"/></g><text x="708" y="403" fill="#ecfeff" font-size="12" text-anchor="middle">tokens 0…n</text><text x="822" y="403" fill="#ecfeff" font-size="12" text-anchor="middle">tokens n…</text><text x="936" y="403" fill="#ecfeff" font-size="12" text-anchor="middle">tokens …</text><text x="1057" y="403" fill="#ecfeff" font-size="12" text-anchor="middle">tokens …L</text>
</g></svg>