263b" stroke="#2fd7f2" stroke-width="2"/><text x="700.0" y="510" text-anchor="middle" fill="#f0f6ff" font-size="20" font-weight="700">Pre-LayerNorm → Feed-Forward / GELU</text><text x="700.0" y="535" text-anchor="middle" fill="#a9bfd6" font-size="15">d_model → 4d_model → d_model</text><rect x="490" y="595" width="420" height="75" rx="14" fill="#12263b" stroke="#2fd7f2" stroke-width="2"/><text x="700.0" y="625" text-anchor="middle" fill="#f0f6ff" font-size="20" font-weight="700">Residual connection + final LayerNorm</text><text x="700.0" y="650" text-anchor="middle" fill="#a9bfd6" font-size="15">contextual hidden states</text><rect x="490" y="710" width="420" height="70" rx="14" fill="#12263b" stroke="#2fd7f2" stroke-width="2"/><text x="700.0" y="740" text-anchor="middle" fill="#f0f6ff" font-size="20" font-weight="700">Language-modeling head</text><text x="700.0" y="765" text-anchor="middle" fill="#a9bfd6" font-size="15">logits · B × T × vocabulary</text>
<rect x="980" y="240" width="340" height="130" rx="14" fill="#102b3a" stroke="#f6a35b" stroke-width="2"/>
<text x="1150" y="276" text-anchor="middle" fill="#f6c38f" font-size="18" font-weight="700">Causal constraint</text>
<text x="1150" y="308" text-anchor="middle" fill="#d6e2f0" font-size="15">Queries at t can read keys</text>
<text x="1150" y="333" text-anchor="middle" fill="#d6e2f0" font-size="15">only at positions ≤ t.</text>
<line x1="910" y1="287" x2="970" y2="287" stroke="#f6a35b" stroke-width="2" stroke-dasharray="6 5"/>
<text x="700" y="832" text-anchor="middle" fill="#8fa5bd" font-size="16">The block repeats N times; diagram simplifies residual paths and tensor reshapes.</text>
