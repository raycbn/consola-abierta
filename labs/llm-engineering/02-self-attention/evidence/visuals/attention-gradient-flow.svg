<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="t d"><title id="t">Self-attention forward and backward dataflow</title><desc id="d">Forward tensor flow from X through Q, K and V to scores, softmax and output; backward gradient path through the chain rule.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#8aa5bd"/></marker></defs><rect width="100%" height="100%" fill="#08111f"/><text x="540" y="34" fill="#f0f6ff" font-size="24" font-weight="700" text-anchor="middle">Self-Attention · forward pass and gradient flow</text><g font-family="Arial" text-anchor="middle"><rect x="35" y="100" width="100" height="58" rx="9" fill="#102b3a" stroke="#22d3ee"/><text x="85" y="135" fill="#fff" font-size="20">X</text><rect x="195" y="58" width="125" height="55" rx="9" fill="#142d46" stroke="#60a5fa"/><text x="257" y="92" fill="#fff" font-size="18">Q = XWQ</text><rect x="195" y="132" width="125" height="55" rx="9" fill="#142d46" stroke="#60a5fa"/><text x="257" y="166" fill="#fff" font-size="18">K = XWK</text><rect x="195" y="206" width="125" height="55" rx="9" fill="#142d46" stroke="#60a5fa"/><text x="257" y="240" fill="#fff" font-size="18">V = XWV</text><rect x="390" y="92" width="155" height="80" rx="9" fill="#26304a" stroke="#a78bfa"/><text x="467" y="124" fill="#fff" font-size="17">S = QKᵀ / √dₖ</text><text x="467" y="150" fill="#cbbcf5" font-size="14">+ causal mask</text><rect x="620" y="92" width="145" height="80" rx="9" fill="#26304a" stroke="#a78bfa"/><text x="692" y="124" fill="#fff" font-size="17">P = softmax(S)</text><text x="692" y="150" fill="#cbbcf5" font-size="14">row-wise</text><rect x="840" y="92" width="175" height="80" rx="9" fill="#123c37" stroke="#34d399"/><text x="927" y="124" fill="#fff" font-size="20">O = PV</text><text x="927" y="150" fill="#a7f3d0" font-size="14">context vectors</text><g stroke="#8aa5bd" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M135 115 L185 86"/><path d="M135 129 L185 159"/><path d="M135 143 L185 233"/><path d="M320 85 L380 112"/><path d="M320 159 L380 150"/><path d="M545 132 L610 132"/><path d="M765 132 L830 132"/><path d="M320 233 C540 315 745 270 870 185"/></g><text x="540" y="330" fill="#fda4af" font-size="20" font-weight="700">Backward pass · chain rule</text><rect x="840" y="370" width="175" height="70" rx="9" fill="#3b1e2a" stroke="#fb7185"/><text x="927" y="399" fill="#fff" font-size="18">Loss L(O)</text><text x="927" y="423" fill="#fecdd3" font-size="13">upstream gradient</text><rect x="620" y="370" width="145" height="70" rx="9" fill="#302139" stroke="#c084fc"/><text x="692" y="399" fill="#fff" font-size="17">∂L / ∂P</text><text x="692" y="423" fill="#e9d5ff" font-size="13">and ∂L / ∂V</text><rect x="390" y="370" width="155" height="70" rx="9" fill="#302139" stroke="#c084fc"/><text x="467" y="399" fill="#fff" font-size="17">∂L / ∂S</text><text x="467" y="423" fill="#e9d5ff" font-size="13">softmax Jacobian</text><rect x="195" y="370" width="125" height="70" rx="9" fill="#3b2c1b" stroke="#fbbf24"/><text x="257" y="399" fill="#fff" font-size="16">∂L/∂Q,K,V</text><text x="257" y="423" fill="#fde68a" font-size="12">then WQ, WK, WV</text><g stroke="#fb7185" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M840 405 L775 405"/><path d="M620 405 L555 405"/><path d="M390 405 L330 405"/></g><text x="540" y="477" fill="#9bb0c7" font-size="14">Gradients reach Q, K and V through both the weighted sum and the score/softmax path.</text></g></svg>