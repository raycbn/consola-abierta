<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Input positions with and without KV cache</title><desc id="d">For a fixed 32-token prompt, cached decoding processes the prompt once and then one new token per step; full-prefix recomputation processes every prefix again.</desc><rect width="1000" height="500" fill="#fbfaf7"/><text x="48" y="52" font-family="Arial" font-size="23" font-weight="700" fill="#192630">Avoid reprocessing the entire prefix at every step</text><rect x="48" y="80" width="14" height="14" fill="#a9573d"/><text x="70" y="93" font-family="Arial" font-size="13" fill="#34444d">Full-prefix recomputation</text><rect x="280" y="80" width="14" height="14" fill="#28566b"/><text x="302" y="93" font-family="Arial" font-size="13" fill="#34444d">Prefill once + incremental decode</text><text x="48" y="149" font-family="Arial" font-size="14" fill="#34444d">D=4</text><rect x="130" y="132" width="18.1" height="20" rx="3" fill="#a9573d"/><rect x="130" y="157" width="4.7" height="20" rx="3" fill="#28566b"/><text x="158.1" y="148" font-family="Arial" font-size="12" fill="#192630">138</text><text x="144.7" y="173" font-family="Arial" font-size="12" fill="#192630">36</text><text x="48" y="210" font-family="Arial" font-size="14" fill="#34444d">D=8</text><rect x="130" y="193" width="38.2" height="20" rx="3" fill="#a9573d"/><rect x="130" y="218" width="5.2" height="20" rx="3" fill="#28566b"/><text x="178.2" y="209" font-family="Arial" font-size="12" fill="#192630">292</text><text x="145.2" y="234" font-family="Arial" font-size="12" fill="#192630">40</text><text x="48" y="271" font-family="Arial" font-size="14" fill="#34444d">D=16</text><rect x="130" y="254" width="84.8" height="20" rx="3" fill="#a9573d"/><rect x="130" y="279" width="6.3" height="20" rx="3" fill="#28566b"/><text x="224.8" y="270" font-family="Arial" font-size="12" fill="#192630">648</text><text x="146.3" y="295" font-family="Arial" font-size="12" fill="#192630">48</text><text x="48" y="332" font-family="Arial" font-size="14" fill="#34444d">D=32</text><rect x="130" y="315" width="203.0" height="20" rx="3" fill="#a9573d"/><rect x="130" y="340" width="8.4" height="20" rx="3" fill="#28566b"/><text x="343.0" y="331" font-family="Arial" font-size="12" fill="#192630">1552</text><text x="148.4" y="356" font-family="Arial" font-size="12" fill="#192630">64</text><text x="48" y="393" font-family="Arial" font-size="14" fill="#34444d">D=64</text><rect x="130" y="376" width="540.0" height="20" rx="3" fill="#a9573d"/><rect x="130" y="401" width="12.6" height="20" rx="3" fill="#28566b"/><text x="680.0" y="392" font-family="Arial" font-size="12" fill="#192630">4128</text><text x="152.6" y="417" font-family="Arial" font-size="12" fill="#192630">96</text><text x="48" y="465" font-family="Arial" font-size="13" fill="#647078">Structural input-position count, not FLOPs, latency or measured speedup.</text></svg>