<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Outliers and quantization range</title><desc id="desc">An outlier expands a shared quantization range and reduces resolution around common values. Local scales can mitigate the effect, but need calibration.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient></defs><rect width="1200" height="500" rx="24" fill="url(#bg)"/><text x="55" y="58" fill="#e2e8f0" font-size="28" font-weight="700" font-family="Arial,sans-serif">OUTLIERS CHANGE THE SCALE</text><text x="55" y="88" fill="#94a3b8" font-size="16" font-family="Arial,sans-serif">One extreme value can determine the resolution available to every value sharing a scale.</text>
<g font-family="Arial,sans-serif">
<text x="70" y="145" fill="#67e8f9" font-size="18" font-weight="700">ONE GLOBAL RANGE</text><line x1="100" y1="285" x2="1085" y2="285" stroke="#64748b" stroke-width="2"/><rect x="100" y="215" width="985" height="140" rx="12" fill="#142943" stroke="#334e68"/>
<g stroke="#38bdf8" stroke-width="3"><line x1="130" y1="275" x2="130" y2="295"/><line x1="190" y1="273" x2="190" y2="297"/><line x1="250" y1="276" x2="250" y2="294"/><line x1="310" y1="272" x2="310" y2="298"/><line x1="370" y1="274" x2="370" y2="296"/><line x1="430" y1="275" x2="430" y2="295"/><line x1="490" y1="272" x2="490" y2="298"/><line x1="550" y1="274" x2="550" y2="296"/></g>
<g fill="#67e8f9"><circle cx="150" cy="245" r="5"/><circle cx="182" cy="245" r="5"/><circle cx="205" cy="245" r="5"/><circle cx="235" cy="245" r="5"/><circle cx="265" cy="245" r="5"/><circle cx="295" cy="245" r="5"/><circle cx="325" cy="245" r="5"/><circle cx="355" cy="245" r="5"/><circle cx="385" cy="245" r="5"/><circle cx="415" cy="245" r="5"/><circle cx="445" cy="245" r="5"/><circle cx="475" cy="245" r="5"/></g>
<path d="M1045 285L1045 170" stroke="#fb923c" stroke-width="4"/><circle cx="1045" cy="170" r="8" fill="#fb923c"/><text x="990" y="145" fill="#fdba74" font-size="16">outlier</text><text x="102" y="385" fill="#94a3b8" font-size="14">Common values occupy a small part of the available code range.</text><text x="102" y="410" fill="#f8fafc" font-size="15">The scale is selected to include the outlier, so normal values can quantize coarsely.</text>
<path d="M565 425V450" stroke="#67e8f9" stroke-width="2"/><text x="600" y="445" fill="#67e8f9" font-size="15" font-weight="700">LOCAL SCALES</text><text x="735" y="445" fill="#cbd5e1" font-size="15">Per-channel / per-group or calibrated clipping can change the trade-off.</text>
</g></svg>