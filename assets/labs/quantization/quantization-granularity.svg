<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Quantization scale granularity</title><desc id="desc">Comparison of one scale for a full tensor, separate scales per output channel, and one scale per group of weights.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient></defs><rect width="1200" height="500" rx="24" fill="url(#bg)"/>
<text x="55" y="58" fill="#e2e8f0" font-size="28" font-weight="700" font-family="Arial,sans-serif">SCALE GRANULARITY</text><text x="55" y="88" fill="#94a3b8" font-size="16" font-family="Arial,sans-serif">More local scales adapt better to heterogeneous ranges — at the cost of metadata.</text>
<g font-family="Arial,sans-serif">
<g transform="translate(55 135)"><text x="0" y="0" fill="#67e8f9" font-size="18" font-weight="700">PER-TENSOR</text><text x="0" y="28" fill="#cbd5e1" font-size="14">One scale for the full matrix</text><rect x="0" y="52" width="320" height="160" rx="10" fill="#142943" stroke="#45617e"/><g fill="#0891b2" opacity=".8"><rect x="12" y="64" width="68" height="34"/><rect x="84" y="64" width="68" height="34"/><rect x="156" y="64" width="68" height="34"/><rect x="228" y="64" width="80" height="34"/><rect x="12" y="102" width="68" height="34"/><rect x="84" y="102" width="68" height="34"/><rect x="156" y="102" width="68" height="34"/><rect x="228" y="102" width="80" height="34"/><rect x="12" y="140" width="68" height="34"/><rect x="84" y="140" width="68" height="34"/><rect x="156" y="140" width="68" height="34"/><rect x="228" y="140" width="80" height="34"/></g><text x="12" y="238" fill="#f8fafc" font-size="16">s = one global scale</text><text x="12" y="262" fill="#94a3b8" font-size="14">Lowest metadata · outlier-sensitive</text></g>
<g transform="translate(440 135)"><text x="0" y="0" fill="#67e8f9" font-size="18" font-weight="700">PER-CHANNEL</text><text x="0" y="28" fill="#cbd5e1" font-size="14">One scale per output row</text><rect x="0" y="52" width="320" height="160" rx="10" fill="#142943" stroke="#45617e"/><g><rect x="12" y="64" width="296" height="34" fill="#0e7490"/><rect x="12" y="102" width="296" height="34" fill="#0891b2"/><rect x="12" y="140" width="296" height="34" fill="#155e75"/><rect x="12" y="178" width="296" height="22" fill="#164e63"/></g><g fill="#e0f2fe" font-size="13"><text x="24" y="87">scale 0</text><text x="24" y="125">scale 1</text><text x="24" y="163">scale 2</text><text x="24" y="195">scale 3</text></g><text x="12" y="238" fill="#f8fafc" font-size="16">s = per output channel</text><text x="12" y="262" fill="#94a3b8" font-size="14">Adapts row ranges · more scales</text></g>
<g transform="translate(825 135)"><text x="0" y="0" fill="#67e8f9" font-size="18" font-weight="700">PER-GROUP</text><text x="0" y="28" fill="#cbd5e1" font-size="14">One scale per local weight group</text><rect x="0" y="52" width="320" height="160" rx="10" fill="#142943" stroke="#45617e"/><g><rect x="12" y="64" width="68" height="34" fill="#0e7490"/><rect x="84" y="64" width="68" height="34" fill="#155e75"/><rect x="156" y="64" width="68" height="34" fill="#0891b2"/><rect x="228" y="64" width="80" height="34" fill="#164e63"/><rect x="12" y="102" width="68" height="34" fill="#164e63"/><rect x="84" y="102" width="68" height="34" fill="#0e7490"/><rect x="156" y="102" width="68" height="34" fill="#155e75"/><rect x="228" y="102" width="80" height="34" fill="#0891b2"/><rect x="12" y="140" width="68" height="34" fill="#155e75"/><rect x="84" y="140" width="68" height="34" fill="#164e63"/><rect x="156" y="140" width="68" height="34" fill="#0e7490"/><rect x="228" y="140" width="80" height="34" fill="#155e75"/></g><text x="12" y="238" fill="#f8fafc" font-size="16">s = per group of G values</text><text x="12" y="262" fill="#94a3b8" font-size="14">Fine control · metadata overhead</text></g>
</g>
<rect x="55" y="435" width="1090" height="38" rx="10" fill="#0b3545" stroke="#155e75"/><text x="75" y="460" fill="#bae6fd" font-size="15" font-family="Arial,sans-serif">Smaller groups reduce local range sharing, but consume more scale metadata and may require different kernels.</text></svg>