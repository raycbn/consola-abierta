<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Quantization pipeline</title><desc id="desc">Flow from floating-point tensor through calibration, scale and zero-point computation, quantization, packed representation and dequantized compute.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#101f36"/></linearGradient><linearGradient id="cyan" x2="1"><stop stop-color="#0e7490"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="470" rx="24" fill="url(#bg)"/><text x="56" y="60" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="28" font-weight="700">QUANTIZATION DATAFLOW</text><text x="56" y="90" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">The numeric transform is separate from the kernel that eventually executes the operation.</text>
<g font-family="Arial,sans-serif">
<rect x="55" y="155" width="190" height="150" rx="16" fill="#142943" stroke="#334e68"/><text x="75" y="190" fill="#67e8f9" font-size="15" font-weight="700">01 · SOURCE</text><text x="75" y="225" fill="#f8fafc" font-size="23" font-weight="700">FP32 tensor</text><text x="75" y="255" fill="#cbd5e1" font-size="15">Weights / activations</text><text x="75" y="279" fill="#94a3b8" font-size="13">Values in real domain</text>
<path d="M250 230H285" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
<rect x="295" y="155" width="190" height="150" rx="16" fill="#142943" stroke="#334e68"/><text x="315" y="190" fill="#67e8f9" font-size="15" font-weight="700">02 · CALIBRATE</text><text x="315" y="225" fill="#f8fafc" font-size="23" font-weight="700">Range / amax</text><text x="315" y="255" fill="#cbd5e1" font-size="15">Observe distribution</text><text x="315" y="279" fill="#94a3b8" font-size="13">Find outliers / clipping</text>
<path d="M490 230H525" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
<rect x="535" y="155" width="190" height="150" rx="16" fill="#142943" stroke="#0e7490"/><text x="555" y="190" fill="#67e8f9" font-size="15" font-weight="700">03 · PARAMETERS</text><text x="555" y="225" fill="#f8fafc" font-size="23" font-weight="700">Scale + ZP</text><text x="555" y="255" fill="#cbd5e1" font-size="15">Granularity matters</text><text x="555" y="279" fill="#94a3b8" font-size="13">Tensor / channel / group</text>
<path d="M730 230H765" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
<rect x="775" y="155" width="165" height="150" rx="16" fill="#142943" stroke="#334e68"/><text x="795" y="190" fill="#67e8f9" font-size="15" font-weight="700">04 · MAP</text><text x="795" y="225" fill="#f8fafc" font-size="23" font-weight="700">INT / FP8</text><text x="795" y="255" fill="#cbd5e1" font-size="15">Round + clamp</text><text x="795" y="279" fill="#94a3b8" font-size="13">Quantized values</text>
<path d="M945 230H980" stroke="#67e8f9" stroke-width="2" marker-end="url(#arr)"/>
<rect x="990" y="155" width="160" height="150" rx="16" fill="#0b3545" stroke="#22d3ee"/><text x="1010" y="190" fill="#67e8f9" font-size="15" font-weight="700">05 · EXECUTE</text><text x="1010" y="225" fill="#f8fafc" font-size="23" font-weight="700">Kernel</text><text x="1010" y="255" fill="#cbd5e1" font-size="15">Pack / dequant</text><text x="1010" y="279" fill="#94a3b8" font-size="13">Hardware + backend</text>
<rect x="295" y="355" width="855" height="65" rx="12" fill="#101f36" stroke="#334e68"/><text x="320" y="382" fill="#67e8f9" font-size="15" font-weight="700">DEQUANTIZATION VIEW</text><text x="320" y="405" fill="#cbd5e1" font-size="15">x̂ = scale × (q − zero_point) · Quantization introduces rounding and clipping error.</text>
<path d="M860 305V345H720V350" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 6"/>
</g></svg>