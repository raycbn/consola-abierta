<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8aa5bd"/></marker></defs>
<rect width="100%" height="100%" fill="#08111f"/>
<text x="750" y="45" text-anchor="middle" fill="#f0f6ff" font-size="30" font-weight="700">Scaled dot-product attention · tensor flow</text>
<text x="750" y="76" text-anchor="middle" fill="#9fb1c8" font-size="18">B = batch · T = sequence length · d = model width · h = heads · dₕ = d / h</text>
<rect x="45" y="300" width="190" height="110" rx="16" fill="#12263b" stroke="#2fd7f2" stroke-width="2"/>
<text x="140" y="338" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">Input X</text>
<text x="140" y="374" text-anchor="middle" fill="#a9bfd6" font-size="18">B × T × d</text>
<rect x="315" y="130" width="220" height="105" rx="16" fill="#102b3a" stroke="#2fd7f2" stroke-width="2"/>
<text x="425" y="171" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">WQ projection</text>
<text x="425" y="205" text-anchor="middle" fill="#a9bfd6" font-size="18">Q = XWQ</text>
<rect x="315" y="300" width="220" height="105" rx="16" fill="#102b3a" stroke="#2fd7f2" stroke-width="2"/>
<text x="425" y="341" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">WK projection</text>
<text x="425" y="375" text-anchor="middle" fill="#a9bfd6" font-size="18">K = XWK</text>
<rect x="315" y="470" width="220" height="105" rx="16" fill="#102b3a" stroke="#2fd7f2" stroke-width="2"/>
<text x="425" y="511" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">WV projection</text>
<text x="425" y="545" text-anchor="middle" fill="#a9bfd6" font-size="18">V = XWV</text>
<path d="M235 355 L270 355 L270 182 L305 182 M270 355 L305 355 M270 355 L270 522 L305 522" fill="none" stroke="#8aa5bd" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="615" y="110" width="235" height="465" rx="16" fill="#112338" stroke="#46617a" stroke-width="2"/>
<text x="732" y="151" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">Split into heads</text>
<text x="732" y="190" text-anchor="middle" fill="#a9bfd6" font-size="17">Q, K, V</text>
<text x="732" y="222" text-anchor="middle" fill="#a9bfd6" font-size="17">B × h × T × dₕ</text>
<rect x="645" y="265" width="175" height="72" rx="12" fill="#18344b" stroke="#2fd7f2"/>
<text x="732" y="294" text-anchor="middle" fill="#f0f6ff" font-size="17">Q · Kᵀ</text>
<text x="732" y="320" text-anchor="middle" fill="#a9bfd6" font-size="15">B × h × T × T</text>
<rect x="645" y="367" width="175" height="65" rx="12" fill="#3a2b22" stroke="#f6a35b"/>
<text x="732" y="408" text-anchor="middle" fill="#ffd2a8" font-size="18">÷ √dₕ + mask</text>
<rect x="645" y="462" width="175" height="65" rx="12" fill="#18344b" stroke="#2fd7f2"/>
<text x="732" y="502" text-anchor="middle" fill="#f0f6ff" font-size="18">Softmax</text>
<path d="M535 182 L580 182 L580 300 L635 300 M535 355 L590 355 L590 300 M535 522 L580 522 L580 500 L635 500" fill="none" stroke="#8aa5bd" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M732 337 L732 357 M732 432 L732 452" stroke="#8aa5bd" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="920" y="275" width="210" height="160" rx="16" fill="#18344b" stroke="#2fd7f2" stroke-width="2"/>
<text x="1025" y="316" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">Weights × V</text>
<text x="1025" y="353" text-anchor="middle" fill="#a9bfd6" font-size="17">B × h × T × T</text>
<text x="1025" y="382" text-anchor="middle" fill="#a9bfd6" font-size="17">× B × h × T × dₕ</text>
<text x="1025" y="411" text-anchor="middle" fill="#6be3f4" font-size="18">B × h × T × dₕ</text>
<path d="M850 495 L885 495 L885 355 L910 355" fill="none" stroke="#8aa5bd" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1200" y="275" width="250" height="160" rx="16" fill="#102b3a" stroke="#2fd7f2" stroke-width="2"/>
<text x="1325" y="316" text-anchor="middle" fill="#f0f6ff" font-size="22" font-weight="700">Concat + WO</text>
<text x="1325" y="355" text-anchor="middle" fill="#a9bfd6" font-size="18">B × T × d</text>
<text x="1325" y="393" text-anchor="middle" fill="#6be3f4" font-size="18">Attention output</text>
<path d="M1130 355 L1190 355" stroke="#8aa5bd" stroke-width="3" marker-end="url(#arrow)"/>
<text x="750" y="660" text-anchor="middle" fill="#f6c38f" font-size="18">Causal mask: scores for key positions s &gt; query position t are set to −∞ before softmax.</text>
<text x="750" y="700" text-anchor="middle" fill="#9fb1c8" font-size="16">The h heads are computed in parallel; their outputs are concatenated, then projected back to d.</text>
</svg>