<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Reproducible LLM benchmark workflow</title><desc id="d">A repeatable workflow defines SLOs and workload, warms up the system, generates controlled offered load, captures client and server traces, repeats runs, and records a full manifest.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9" stroke-width="1.5"/></marker></defs><rect width="1200" height="600" rx="24" fill="url(#bg)"/><text x="52" y="58" fill="#e2e8f0" font-family="Arial" font-size="28" font-weight="700">REPRODUCIBLE BENCHMARK · THE EXPERIMENT IS THE UNIT</text><g font-family="Arial"><g><rect x="58" y="130" width="300" height="120" rx="16" fill="#102f49" stroke="#22d3ee" stroke-width="2"/><text x="84" y="166" fill="#67e8f9" font-size="17" font-weight="700">01 · DEFINE</text><text x="84" y="198" fill="#f1f5f9" font-size="20">Question + SLO</text><text x="84" y="225" fill="#cbd5e1" font-size="14">Quality, latency, goodput, cost</text></g><path d="M358 190H415" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/><g><rect x="420" y="130" width="300" height="120" rx="16" fill="#102f49" stroke="#22d3ee" stroke-width="2"/><text x="446" y="166" fill="#67e8f9" font-size="17" font-weight="700">02 · SPECIFY</text><text x="446" y="198" fill="#f1f5f9" font-size="20">Workload + manifest</text><text x="446" y="225" fill="#cbd5e1" font-size="14">Model, tokens, arrival, cache, params</text></g><path d="M720 190H777" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/><g><rect x="782" y="130" width="350" height="120" rx="16" fill="#102f49" stroke="#22d3ee" stroke-width="2"/><text x="808" y="166" fill="#67e8f9" font-size="17" font-weight="700">03 · PREPARE</text><text x="808" y="198" fill="#f1f5f9" font-size="20">Warmup + cache policy</text><text x="808" y="225" fill="#cbd5e1" font-size="14">Separate warmup from measured samples</text></g><path d="M957 250V315" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/><g><rect x="782" y="320" width="350" height="120" rx="16" fill="#142b48" stroke="#a78bfa" stroke-width="2"/><text x="808" y="356" fill="#c4b5fd" font-size="17" font-weight="700">04 · GENERATE</text><text x="808" y="388" fill="#f1f5f9" font-size="20">Controlled offered load</text><text x="808" y="415" fill="#cbd5e1" font-size="14">Rate, concurrency, open/closed-loop</text></g><path d="M782 380H725" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/><g><rect x="420" y="320" width="300" height="120" rx="16" fill="#142b48" stroke="#a78bfa" stroke-width="2"/><text x="446" y="356" fill="#c4b5fd" font-size="17" font-weight="700">05 · OBSERVE</text><text x="446" y="388" fill="#f1f5f9" font-size="20">Client + server traces</text><text x="446" y="415" fill="#cbd5e1" font-size="14">TTFT, ITL, TPOT, E2E, queue, GPU, KV</text></g><path d="M420 380H363" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/><g><rect x="58" y="320" width="300" height="120" rx="16" fill="#142b48" stroke="#a78bfa" stroke-width="2"/><text x="84" y="356" fill="#c4b5fd" font-size="17" font-weight="700">06 · REPEAT + REPORT</text><text x="84" y="388" fill="#f1f5f9" font-size="20">Percentiles + evidence</text><text x="84" y="415" fill="#cbd5e1" font-size="14">Variance, errors, SLO goodput, cost</text></g><path d="M210 440V500H980V440" fill="none" stroke="#64748b" stroke-dasharray="7 7" stroke-width="2"/><text x="595" y="536" text-anchor="middle" fill="#94a3b8" font-size="16">Change one factor at a time · preserve raw data · version every run</text></g></svg>