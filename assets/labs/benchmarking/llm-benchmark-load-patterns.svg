<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Open-loop and closed-loop LLM benchmark load generation</title><desc id="d">Open-loop arrivals are scheduled independently of completion; closed-loop clients send the next request after the previous response. Below, constant, Poisson-like and bursty arrivals are shown conceptually.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9" stroke-width="1.5"/></marker></defs><rect width="1200" height="600" rx="24" fill="url(#bg)"/><text x="52" y="55" fill="#e2e8f0" font-family="Arial" font-size="28" font-weight="700">LOAD GENERATION · ARRIVAL PROCESS MATTERS</text><g font-family="Arial"><rect x="55" y="90" width="520" height="190" rx="16" fill="#102a42" stroke="#155e75"/><text x="82" y="125" fill="#67e8f9" font-size="20" font-weight="700">OPEN-LOOP · ARRIVAL-CONTROLLED</text><rect x="85" y="156" width="130" height="62" rx="10" fill="#0b3545" stroke="#22d3ee"/><text x="150" y="193" text-anchor="middle" fill="#e2e8f0" font-size="17">Scheduler</text><path d="M215 187H345" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/><rect x="350" y="156" width="175" height="62" rx="10" fill="#182e4a" stroke="#38bdf8"/><text x="437" y="193" text-anchor="middle" fill="#e2e8f0" font-size="17">Inference server</text><text x="84" y="250" fill="#cbd5e1" font-size="14">New arrivals follow the target schedule even when earlier requests slow down.</text><rect x="625" y="90" width="520" height="190" rx="16" fill="#102a42" stroke="#334e68"/><text x="652" y="125" fill="#c4b5fd" font-size="20" font-weight="700">CLOSED-LOOP · COMPLETION-CONTROLLED</text><rect x="655" y="156" width="135" height="62" rx="10" fill="#302652" stroke="#a78bfa"/><text x="722" y="193" text-anchor="middle" fill="#e2e8f0" font-size="17">Client</text><path d="M790 174H920" stroke="#c4b5fd" stroke-width="3" marker-end="url(#a)"/><rect x="925" y="156" width="175" height="62" rx="10" fill="#182e4a" stroke="#38bdf8"/><text x="1012" y="193" text-anchor="middle" fill="#e2e8f0" font-size="17">Server</text><path d="M1010 220V240H725V220" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#a)"/><text x="652" y="264" fill="#cbd5e1" font-size="14">Client waits for completion before sending again: offered load falls as latency rises.</text><text x="58" y="335" fill="#94a3b8" font-size="16">CONCEPTUAL ARRIVAL TIMELINES · SAME AVERAGE RATE CAN HIDE DIFFERENT BURST SHAPES</text><g stroke="#64748b" stroke-width="2"><line x1="110" y1="500" x2="1090" y2="500"/></g><g fill="#67e8f9"><rect x="150" y="442" width="10" height="58" rx="3"/><rect x="260" y="442" width="10" height="58" rx="3"/><rect x="370" y="442" width="10" height="58" rx="3"/><rect x="480" y="442" width="10" height="58" rx="3"/><rect x="590" y="442" width="10" height="58" rx="3"/><rect x="700" y="442" width="10" height="58" rx="3"/><rect x="810" y="442" width="10" height="58" rx="3"/><rect x="920" y="442" width="10" height="58" rx="3"/></g><g fill="#a78bfa"><rect x="150" y="390" width="7" height="110" rx="3"/><rect x="218" y="450" width="7" height="50" rx="3"/><rect x="325" y="420" width="7" height="80" rx="3"/><rect x="468" y="455" width="7" height="45" rx="3"/><rect x="590" y="405" width="7" height="95" rx="3"/><rect x="744" y="435" width="7" height="65" rx="3"/><rect x="890" y="392" width="7" height="108" rx="3"/><rect x="1040" y="448" width="7" height="52" rx="3"/></g><g fill="#fb923c"><rect x="150" y="375" width="8" height="125" rx="3"/><rect x="172" y="375" width="8" height="125" rx="3"/><rect x="194" y="375" width="8" height="125" rx="3"/><rect x="216" y="375" width="8" height="125" rx="3"/><rect x="238" y="375" width="8" height="125" rx="3"/><rect x="505" y="375" width="8" height="125" rx="3"/><rect x="527" y="375" width="8" height="125" rx="3"/><rect x="549" y="375" width="8" height="125" rx="3"/><rect x="571" y="375" width="8" height="125" rx="3"/><rect x="593" y="375" width="8" height="125" rx="3"/></g><g font-size="15" fill="#cbd5e1"><text x="150" y="535">Constant</text><text x="480" y="535">Poisson-like / random</text><text x="890" y="535">Bursty clusters</text></g><g font-family="Arial" font-size="14"><rect x="800" y="302" width="14" height="14" rx="3" fill="#67e8f9"/><text x="822" y="314" fill="#cbd5e1">Constant spacing</text><rect x="960" y="302" width="14" height="14" rx="3" fill="#a78bfa"/><text x="982" y="314" fill="#cbd5e1">Random arrivals</text><rect x="800" y="326" width="14" height="14" rx="3" fill="#fb923c"/><text x="822" y="338" fill="#cbd5e1">Burst arrivals</text></g></g></svg>