<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">LLM serving latency metrics timeline</title><desc id="d">Client sends a request, receives first content, receives further chunks and completes. TTFT, inter-token latency, time per output token and end-to-end latency are shown.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9" stroke-width="1.5"/></marker></defs><rect width="1200" height="560" rx="24" fill="url(#bg)"/><text x="52" y="56" fill="#e2e8f0" font-family="Arial" font-size="28" font-weight="700">CLIENT-OBSERVED STREAM · WHERE EACH CLOCK STARTS</text><text x="58" y="104" fill="#94a3b8" font-family="Arial" font-size="16">Illustrative timing only · no performance values implied</text><line x1="115" y1="280" x2="1080" y2="280" stroke="#64748b" stroke-width="3"/><g stroke="#67e8f9" stroke-width="2"><line x1="155" y1="250" x2="155" y2="310"/><line x1="430" y1="250" x2="430" y2="310"/><line x1="610" y1="250" x2="610" y2="310"/><line x1="770" y1="250" x2="770" y2="310"/><line x1="1030" y1="250" x2="1030" y2="310"/></g><g fill="#e2e8f0" font-family="Arial" font-size="18" text-anchor="middle"><text x="155" y="344">Request sent</text><text x="430" y="344">First content</text><text x="610" y="344">Chunk 2</text><text x="770" y="344">Chunk 3</text><text x="1030" y="344">Completed</text></g><g fill="#67e8f9"><circle cx="155" cy="280" r="9"/><circle cx="430" cy="280" r="9"/><circle cx="610" cy="280" r="9"/><circle cx="770" cy="280" r="9"/><circle cx="1030" cy="280" r="9"/></g><path d="M155 210V175H430V210" fill="none" stroke="#22d3ee" stroke-width="4"/><text x="292" y="156" text-anchor="middle" fill="#67e8f9" font-family="Arial" font-size="20" font-weight="700">TTFT</text><path d="M430 390V420H1030V390" fill="none" stroke="#38bdf8" stroke-width="4"/><text x="730" y="456" text-anchor="middle" fill="#7dd3fc" font-family="Arial" font-size="20" font-weight="700">Decode window = E2E − TTFT</text><path d="M610 225V190H770V225" fill="none" stroke="#a78bfa" stroke-width="4"/><text x="690" y="176" text-anchor="middle" fill="#c4b5fd" font-family="Arial" font-size="17" font-weight="700">ITL: event-to-event gap</text><rect x="66" y="485" width="1068" height="46" rx="12" fill="#142943" stroke="#334e68"/><text x="88" y="514" fill="#cbd5e1" font-family="Arial" font-size="15">TPOT = (E2E − TTFT) / (output tokens − 1) · ITL counts streamed event gaps; a chunk can contain multiple tokens.</text></svg>