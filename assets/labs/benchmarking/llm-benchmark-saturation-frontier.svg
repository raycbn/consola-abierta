<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t d"><title id="t">Conceptual LLM serving saturation frontier</title><desc id="d">As offered request rate rises, throughput rises then plateaus, while p99 latency bends sharply upward. The desired operating region stays within an SLO budget.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient></defs><rect width="1200" height="600" rx="24" fill="url(#bg)"/><text x="52" y="55" fill="#e2e8f0" font-family="Arial" font-size="28" font-weight="700">THE SATURATION FRONTIER · CONCEPTUAL, NOT MEASURED DATA</text><g stroke="#475569" stroke-width="1" opacity=".65"><line x1="160" y1="150" x2="160" y2="475"/><line x1="160" y1="475" x2="1065" y2="475"/><line x1="160" y1="394" x2="1065" y2="394" stroke-dasharray="6 7"/><line x1="160" y1="313" x2="1065" y2="313" stroke-dasharray="6 7"/><line x1="160" y1="232" x2="1065" y2="232" stroke-dasharray="6 7"/></g><rect x="160" y="245" width="500" height="230" fill="#0f766e" opacity=".12"/><line x1="160" y1="245" x2="1065" y2="245" stroke="#fb923c" stroke-width="2.5" stroke-dasharray="10 7"/><text x="180" y="230" fill="#fdba74" font-family="Arial" font-size="17">Latency SLO budget</text><path d="M170 450 C300 420 430 350 550 300 S790 260 1045 255" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/><path d="M170 455 C340 452 460 430 570 380 S720 250 770 175 S900 95 1045 75" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round"/><g fill="#e2e8f0" font-family="Arial" font-size="16"><text x="75" y="320" transform="rotate(-90 75 320)" text-anchor="middle">Relative metric scale</text><text x="610" y="530" text-anchor="middle">Offered request rate / concurrency increases →</text></g><g font-family="Arial" font-size="18" font-weight="700"><text x="800" y="286" fill="#67e8f9">Aggregate throughput</text><text x="850" y="130" fill="#fdba74">p99 latency</text><text x="225" y="430" fill="#99f6e4">SLO-feasible operating region</text></g><path d="M660 170V475" stroke="#e2e8f0" stroke-dasharray="5 6" opacity=".65"/><text x="674" y="195" fill="#e2e8f0" font-family="Arial" font-size="15">Knee / saturation</text><rect x="60" y="558" width="1080" height="28" rx="8" fill="#142943"/><text x="78" y="578" fill="#cbd5e1" font-family="Arial" font-size="14">Find the highest offered load that still meets the latency and error SLO; peak throughput alone is not the target.</text></svg>