<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Tensor Parallelism: column-wise and row-wise linear sharding</title><desc id="d">Column-wise shards of a weight matrix produce output slices that are concatenated. Row-wise shards produce partial sums that are reduced across ranks.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#10243c"/></linearGradient><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#67e8f9" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="520" rx="24" fill="url(#bg)"/><text x="52" y="58" fill="#e2e8f0" font-family="Arial" font-size="28" font-weight="700">TENSOR PARALLELISM · SPLIT THE MATRIX, NOT THE LAYER DEPTH</text>
<g font-family="Arial">
<text x="60" y="108" fill="#67e8f9" font-size="19" font-weight="700">COLUMN-WISE · shard output features</text>
<rect x="60" y="136" width="140" height="58" rx="10" fill="#142943" stroke="#45617e"/><text x="130" y="171" fill="#f8fafc" text-anchor="middle" font-size="18">X [B,H]</text>
<path d="M205 165H260" stroke="#67e8f9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="270" y="132" width="220" height="112" rx="10" fill="#142943" stroke="#45617e"/><g><rect x="284" y="147" width="42" height="82" rx="4" fill="#0e7490"/><rect x="332" y="147" width="42" height="82" rx="4" fill="#155e75"/><rect x="380" y="147" width="42" height="82" rx="4" fill="#0e7490"/><rect x="428" y="147" width="48" height="82" rx="4" fill="#155e75"/></g><text x="380" y="260" fill="#cbd5e1" text-anchor="middle" font-size="14">W [H, O] split by columns</text>
<path d="M495 188H540" stroke="#67e8f9" stroke-width="2" marker-end="url(#ar)"/>
<g><rect x="550" y="137" width="106" height="52" rx="8" fill="#0b3545" stroke="#0e7490"/><text x="603" y="168" fill="#ecfeff" text-anchor="middle" font-size="16">rank 0</text><rect x="550" y="197" width="106" height="52" rx="8" fill="#0b3545" stroke="#0e7490"/><text x="603" y="228" fill="#ecfeff" text-anchor="middle" font-size="16">rank 1</text></g>
<path d="M662 163H720M662 223H720" stroke="#67e8f9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="730" y="146" width="190" height="86" rx="10" fill="#142943" stroke="#45617e"/><g fill="#0891b2"><rect x="747" y="163" width="37" height="52"/><rect x="788" y="163" width="37" height="52"/><rect x="829" y="163" width="37" height="52"/><rect x="870" y="163" width="33" height="52"/></g><text x="825" y="260" fill="#cbd5e1" text-anchor="middle" font-size="14">Concatenate / All-Gather*</text>
<path d="M926 188H970" stroke="#67e8f9" stroke-width="2" marker-end="url(#ar)"/><rect x="980" y="150" width="160" height="74" rx="10" fill="#0b3545" stroke="#22d3ee"/><text x="1060" y="181" fill="#f8fafc" text-anchor="middle" font-size="18">Y [B,O]</text><text x="1060" y="203" fill="#bae6fd" text-anchor="middle" font-size="12">joined output</text>
<text x="60" y="309" fill="#67e8f9" font-size="19" font-weight="700">ROW-WISE · shard input features</text>
<rect x="60" y="349" width="140" height="58" rx="10" fill="#142943" stroke="#45617e"/><text x="130" y="384" fill="#f8fafc" text-anchor="middle" font-size="18">X [B,H]</text>
<path d="M205 378H260" stroke="#67e8f9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="270" y="330" width="220" height="102" rx="10" fill="#142943" stroke="#45617e"/><g><rect x="284" y="344" width="90" height="74" rx="4" fill="#0e7490"/><rect x="380" y="344" width="96" height="74" rx="4" fill="#155e75"/></g><text x="380" y="450" fill="#cbd5e1" text-anchor="middle" font-size="14">W [H,O] split by rows</text>
<path d="M495 382H540" stroke="#67e8f9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="550" y="342" width="120" height="52" rx="8" fill="#0b3545" stroke="#0e7490"/><text x="610" y="374" fill="#ecfeff" text-anchor="middle" font-size="16">partial y₀</text><rect x="550" y="402" width="120" height="52" rx="8" fill="#0b3545" stroke="#0e7490"/><text x="610" y="434" fill="#ecfeff" text-anchor="middle" font-size="16">partial y₁</text>
<path d="M676 368H720M676 428H720" stroke="#67e8f9" stroke-width="2" marker-end="url(#ar)"/>
<rect x="730" y="356" width="190" height="88" rx="10" fill="#142943" stroke="#0e7490"/><text x="825" y="390" fill="#f8fafc" text-anchor="middle" font-size="18">All-Reduce SUM</text><text x="825" y="415" fill="#94a3b8" text-anchor="middle" font-size="14">combine partial outputs</text>
<path d="M926 400H970" stroke="#67e8f9" stroke-width="2" marker-end="url(#ar)"/><rect x="980" y="363" width="160" height="74" rx="10" fill="#0b3545" stroke="#22d3ee"/><text x="1060" y="394" fill="#f8fafc" text-anchor="middle" font-size="18">Y [B,O]</text><text x="1060" y="416" fill="#bae6fd" text-anchor="middle" font-size="12">summed output</text>
<text x="60" y="494" fill="#94a3b8" font-size="13">* Exact collectives/layout transitions depend on the implementation. PyTorch DTensor and Megatron-style layers may fuse or defer communication.</text></g></svg>