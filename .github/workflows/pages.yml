name: Deploy Consola Abierta to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test recovery scorecard lab
        run: python -m unittest discover -s assets/labs/recovery-test-scorecard/tests -v
      - name: Build recovery scorecard ZIP
        run: python assets/labs/recovery-test-scorecard/build_lab.py
      - name: Test recovery runbook preflight lab
        run: python -m unittest discover -s assets/labs/recovery-runbook-preflight/tests -v
      - name: Build recovery runbook preflight ZIP
        run: python assets/labs/recovery-runbook-preflight/build_lab.py
      - name: Test recovery evidence pack lab
        run: |
          mkdir -p "$RUNNER_TEMP/recovery-evidence-pack"
          unzip -q assets/labs/recovery-evidence-pack/recovery-evidence-pack-03-lab.zip -d "$RUNNER_TEMP/recovery-evidence-pack"
          python -m unittest discover -s "$RUNNER_TEMP/recovery-evidence-pack/recovery-evidence-pack-03-lab/tests" -v
      - name: Validate text encoding
        run: node validate-text-encoding.cjs
      - name: Validate structured data
        run: node validate-structured-data.cjs
      - name: Validate internal links
        run: node validate-internal-links.cjs
      - name: Validate privacy and consent implementation
        run: node validate-privacy-implementation.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
